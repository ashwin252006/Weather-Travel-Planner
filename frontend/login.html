<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to Weather Travel Planner">
    <title>Login - Weather Travel Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="main-content" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem;">
        <div class="modal" style="max-width: 450px; margin: 0;">
            <div class="modal-header">
                <h3>Sign In</h3>
                <a href="index.html" class="modal-close" aria-label="Close">&times;</a>
            </div>
            <div class="modal-body">
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" name="email" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" name="password" required autocomplete="current-password">
                    </div>
                    <div class="form-group form-check">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <label for="rememberMe">Remember me</label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                    <p class="auth-switch">
                        Don't have an account? 
                        <a href="register.html" class="switch-tab">Sign up</a>
                    </p>
                </form>
            </div>
        </div>
    </main>
    <div class="toast-container" id="toastContainer"></div>
    <script src="js/app.js" type="module"></script>
</body>
</html>
